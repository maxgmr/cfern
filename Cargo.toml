[package]
name = "cfern"
version = "0.1.0"
edition = "2024"
authors = ["Max Gilmour"]

[dependencies]
camino = "1"
clap = { version = "4", features = ["derive"] }
color-eyre = "0"
strum = { version = "0.27", features = ["derive"] }

# Avoid bad color-eyre performance on debug builds
[profile.dev.package.backtrace]
opt-level = 3
